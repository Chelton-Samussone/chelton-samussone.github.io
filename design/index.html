<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfólio de design de Chelton Samussone." data-i18n="pageDescription">
    <title>Design — Chelton Samussone</title>
    <link rel="canonical" href="https://chelton-samussone.github.io/design/">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="../">CHELTON SAMUSSONE</a>
        <a class="back-link" href="../" data-i18n="back">Voltar ao portfólio principal</a>
        <button class="language-toggle" type="button" aria-label="Switch language to English">EN</button>
    </header>

    <main>
        <section class="intro">
            <p class="eyebrow" data-i18n="eyebrow">PORTFÓLIO · DESIGN</p>
            <h1 data-i18n="title">Portfólio de design.</h1>
            <p class="description" data-i18n="description">
                Uma seleção de projetos de design gráfico, comunicação visual e identidade.
            </p>
        </section>

        <section class="reader" aria-label="Livro do portfólio">
            <div class="book" id="book">
                <div class="book-cover">
                    <span class="cover-label" data-i18n="coverLabel">PORTFÓLIO · 2026</span>
                    <strong>CHELTON<br>SAMUSSONE</strong>
                    <span class="cover-subtitle" data-i18n="coverSubtitle">DESIGN GRÁFICO<br>IDENTIDADE VISUAL</span>
                    <button class="open-book" type="button" data-i18n="open">Abrir portfólio</button>
                </div>
                <div class="book-pages" hidden>
                    <div class="book-page left-page">
                        <canvas aria-label="Página esquerda"></canvas>
                    </div>
                    <div class="book-page right-page">
                        <canvas aria-label="Página direita"></canvas>
                    </div>
                </div>
                <p class="reader-error" role="alert" hidden></p>
            </div>

            <div class="reader-controls" hidden>
                <button class="previous-page" type="button" aria-label="Página anterior" data-i18n="previous">← Anterior</button>
                <div class="page-status">
                    <span class="page-count" aria-live="polite">1 / 1</span>
                    <span class="page-progress"><span></span></span>
                </div>
                <button class="next-page" type="button" aria-label="Página seguinte" data-i18n="next">Seguinte →</button>
            </div>
            <p class="reader-hint" data-i18n="hint">Folheia com os botões ou as teclas ← →.</p>
        </section>
    </main>

    <script src="script.js" type="module"></script>
</body>
</html>
