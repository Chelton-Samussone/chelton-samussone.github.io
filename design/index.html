<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfólio de design de Chelton Samussone." data-i18n="pageDescription">
    <title>Design — Chelton Samussone</title>
    <link rel="canonical" href="https://chelton-samussone.github.io/design/">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header" hidden>
        <a class="logo" href="../">CHELTON SAMUSSONE</a>
        <a class="back-link" href="../" data-i18n="back">Voltar ao portfólio principal</a>
        <a class="whatsapp-link" href="https://wa.me/258879610770" target="_blank" rel="noopener noreferrer" data-i18n="contactWhatsApp">Falar comigo no WhatsApp</a>
        <button class="language-toggle" type="button" aria-label="Switch language to English">EN</button>
    </header>

    <main>
        <section class="reader" aria-label="Portfólio em páginas">
            <div class="book" id="book">
                <div class="book-cover">
                    <img class="cover-art" src="Capa.jpg" alt="Capa do portfólio de Chelton Samussone" data-i18n="coverAlt" fetchpriority="high">
                    <button class="open-book" type="button" data-i18n="open">Abrir portfólio</button>
                </div>
                <div class="portfolio-pages" id="portfolio-pages" hidden></div>
                <footer class="portfolio-footer" hidden>
                    <a class="whatsapp-link" href="https://wa.me/258879610770" target="_blank" rel="noopener noreferrer" data-i18n="contactWhatsApp">Falar comigo no WhatsApp</a>
                </footer>
                <p class="reader-error" role="alert" hidden></p>
            </div>

            <p class="reader-hint" data-i18n="hint" hidden>Percorre o portfólio fazendo scroll pela página.</p>
        </section>
    </main>

    <script src="script.js" type="module"></script>
</body>
</html>
